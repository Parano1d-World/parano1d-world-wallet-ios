<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 200 200">
  <!-- The green ring and numeral retain the upstream Parano1d brand geometry.
       iOS clips the square to its own icon mask; no drawn app-tile border. -->
  <defs>
    <radialGradient id="background" cx="35%" cy="28%" r="84%">
      <stop stop-color="#0b1513"/>
      <stop offset="1" stop-color="#020605"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#35f27d"/>
      <stop offset="1" stop-color="#1edc69"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#background)"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#green)" stroke-width="20"/>
  <path transform="translate(6 0)" d="M74 80 100 59V143" fill="none" stroke="#2de473" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

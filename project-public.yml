# App Store edition (iPhone, iPad, Apple Watch, Mac via Mac Catalyst).
# Standalone source tree: the private TestFlight build is a separate tree.
# Excluded features are not present in this source.
name: Parano1dPublic
options:
  bundleIdPrefix: com.koajent
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    "ARCHS[sdk=iphonesimulator*]": "$(NATIVE_ARCH_ACTUAL)"
    PARANO1D_PRIVACY_POLICY_URL: ""
    PARANO1D_TERMS_URL: ""
    PARANO1D_SUPPORT_URL: ""
targets:
  Parano1dPublic:
    type: application
    platform: iOS
    info:
      path: PublicEdition/Info.plist
      properties:
        UIAppFonts:
          - CyberMono-Regular.ttf
          - CyberMono-Bold.ttf
          - DepartureMono-Regular.ttf
          - CyberSans-Regular.ttf
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.koajent.parano1d.wallet.node-sync
          - com.koajent.parano1d.wallet.mining-check
        CFBundleURLTypes:
          - CFBundleURLName: com.koajent.parano1d.contact
            CFBundleURLSchemes:
              - paramo1d
        LSApplicationQueriesSchemes:
          - mailto
        Parano1dPrivacyPolicyURL: "$(PARANO1D_PRIVACY_POLICY_URL)"
        Parano1dTermsURL: "$(PARANO1D_TERMS_URL)"
        Parano1dSupportURL: "$(PARANO1D_SUPPORT_URL)"
    sources:
      - path: App
      - path: Node/NodeParameters
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Native/ParanoidCore.xcframework
        embed: false
      - framework: Node/ParanoidNode.xcframework
        embed: false
      # Rust's system_configuration crate references the SCNetwork symbols.
      - sdk: SystemConfiguration.framework
      - target: Parano1dPhoneWidgets
        # Home Screen and Lock Screen widgets (balance, mining); iPhone and iPad only.
        platformFilter: ios
        embed: true
        codeSign: true
      - target: Parano1dWatch
        # The watch app ships only inside the iPhone app, never the Mac build.
        platformFilter: ios
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_NAME: Parano1dWallet
        PRODUCT_MODULE_NAME: Paranoid
        PRODUCT_BUNDLE_IDENTIFIER: com.koajent.parano1d.wallet
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PUBLIC_EDITION"
        # iPhone and iPad, plus a Mac Catalyst build that runs on Intel and Apple silicon Macs.
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS: PublicEdition/Parano1dWallet.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PublicEdition/Parano1dMac.entitlements
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parano1d Wallet
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your wallet and protect your recovery key.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save NFT artwork you own to Photos. Parano1d only adds images and never reads your library.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a Parano1d address or a contact's invitation QR code. Photos are not saved or uploaded.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: If you turn on nearby relay, Bluetooth carries encrypted messages between nearby Parano1d wallets, including while the app is in the background.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_Parano1dPublicGatewayURL: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(BUILT_PRODUCTS_DIR)/include/ParanoidCore", "$(BUILT_PRODUCTS_DIR)/include/ParanoidNode"]
        OTHER_LDFLAGS: ["$(inherited)", "-liconv"]
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 25
  Parano1dWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    entitlements:
      path: WatchApp/ParanoidWatch.entitlements
    dependencies:
      - target: Parano1dWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: Parano1dWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.koajent.parano1d.wallet.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parano1d
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.koajent.parano1d.wallet
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '4'
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 25
  Parano1dWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: WatchApp/WatchGroup.swift
    entitlements:
      path: WatchWidgets/ParanoidWatchWidgets.entitlements
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Parano1d
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: Parano1dWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.koajent.parano1d.wallet.watchkitapp.widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '4'
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 25
  Parano1dPhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PhoneWidgets
      - path: App/PhoneWidgetData.swift
    entitlements:
      path: PhoneWidgets/PhoneWidgets.entitlements
    info:
      path: PhoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Parano1d
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: Parano1dPhoneWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.koajent.parano1d.wallet.widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 25
  Parano1dPublicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Swift]
    dependencies:
      - target: Parano1dPublic
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PUBLIC_EDITION"
        TARGETED_DEVICE_FAMILY: '1,2'
        # Xcode signs the test bundle, so it needs a generated Info.plist.
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Parano1dWallet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Parano1dWallet"
schemes:
  Parano1dPublic:
    build:
      targets:
        Parano1dPublic: all
        Parano1dPublicTests: [test]
    test:
      targets: [Parano1dPublicTests]
